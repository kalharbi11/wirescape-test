# T0 (lab proposals/0024 §2.4): every PR push and main, Linux x64. Changed modules only; every module,
# the harness unit tests and the fixture self-test when tools/**, workflows or LAB_PIN change.
# Required check: "t0". The scope job passes in seconds when nothing it covers changed.
name: T0

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t0-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
      all: ${{ steps.scope.outputs.all }}
      modules: ${{ steps.scope.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify changed paths (fails closed to everything)
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE" ] && [ -n "$HEAD" ]; then
            python3 tools/wstest.py scope --base "$BASE" --head "$HEAD"
          else
            python3 tools/wstest.py scope
          fi

  linux-x64:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    uses: ./.github/workflows/wstest-run.yml
    with:
      platform: linux-x64
      runner: ubuntu-latest
      modules: ${{ needs.scope.outputs.modules }}
      all: ${{ needs.scope.outputs.all == 'true' }}

  t0:
    name: t0
    needs: [scope, linux-x64]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require scope and every T0 run to pass (skipped means nothing to run)
        env:
          SCOPE: ${{ needs.scope.result }}
          RUN: ${{ needs.linux-x64.result }}
        run: |
          echo "scope=$SCOPE linux-x64=$RUN"
          [ "$SCOPE" = success ] || exit 1
          case "$RUN" in success|skipped) ;; *) exit 1 ;; esac
